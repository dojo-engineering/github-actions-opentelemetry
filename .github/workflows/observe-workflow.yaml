name: observe-workflow

on:
  workflow_run:
    workflows:
      - 'PRs'
      - 'On Main'
    types:
      - 'completed'

permissions:
  actions: 'read'
  contents: 'read'

jobs:
  send-telemetry:
    name: 'Send CI Telemetry'
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: 'ubuntu-latest'
    steps:
      # workflow_run always runs from the default branch, so this dogfoods the
      # action as currently committed on main (including dist/).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run
        id: run
        uses: ./
        env:
          OTEL_SERVICE_NAME: github-actions-opentelemetry
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://telemetry.preprod.dojo.tech/tempo/write/v1/traces
          OTEL_EXPORTER_OTLP_TRACES_HEADERS:
            X-API-Key=${{ secrets.REPO_GRAFANA_TRACES_AUTH_TOKEN }}
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: https://telemetry.preprod.dojo.tech/mimir/write/api/v1/push
          OTEL_EXPORTER_OTLP_METRICS_HEADERS:
            X-API-Key=${{ secrets.REPO_GRAFANA_METRICS_AUTH_TOKEN
            }},X-Scope-Orgid=dojo
          OTEL_RESOURCE_ATTRIBUTES:
            'environment=ci,cicd.pipeline.name=${{
            github.event.workflow_run.name }},cicd.pipeline.run.url.full=${{
            github.event.workflow_run.html_url }},vcs.repository.name=${{
            github.event.workflow_run.repository.name }},vcs.ref.head.name=${{
            github.event.workflow_run.head_branch }}'
          OTEL_LOG_LEVEL: debug
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
