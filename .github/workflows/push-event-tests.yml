name: Push Event Tests
# End-to-end test of the action in "current workflow" mode. Must remain a
# standalone workflow: the action collects every job in this run, and the
# expected test data assumes this workflow's name and job set.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  example-app:
    name: Example Application Pipeline
    strategy:
      matrix:
        fixed-sleep: [1, 2]
        random-sleep: [1, 2]
    uses: ./.github/workflows/example-app-workflow.yml
    with:
      fixed-sleep: ${{ matrix.fixed-sleep }}
      random-sleep: ${{ matrix.random-sleep }}

  # Test the action for push events using the reusable workflow
  test-action:
    needs: example-app
    name: Test Action (Push Event)
    uses: ./.github/workflows/validate-action-output.yml
    with:
      test-data-directory: push-event-tests
      expected-repository: ${{ github.repository }}
      artifact-name: collector-logs-push-event-tests
      retention-days: 5
    secrets: inherit
